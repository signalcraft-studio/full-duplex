# Refresh upcoming launches from Launch Library 2 a few times a day.
# Only updates data/launches.json and the pages built from it (home countdown,
# /launches/ list, .ics files, sitemap). Keeps the cache if the API fails.
# Does not touch tracker rows, satellite counts, race data or launch-tags.
# A GITHUB_TOKEN push does not trigger the Pages deploy workflow, so
# .github/workflows/pages.yml also runs on workflow_run of this workflow.
name: Refresh launches
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'   # 4 runs a day = 20 API calls/day, far below the free 15/hour limit
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-launches
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py rebuilds the tracker change log from git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 scripts/fetch_launches.py --force
      - run: python3 scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "Full Duplex bot"
          git config user.email "actions@users.noreply.github.com"
          # Only stage launch-derived outputs. Never tracker rows, satellite
          # counts, race data or manual Direct to Cell tags.
          git add data/launches.json index.html launches/ sitemap.xml
          if git diff --cached --name-only | grep -E '^(data/(constellations|race|launch-tags)\.json|tracker\.html|tracker/)'; then
            echo "Refusing to commit protected tracker or constellation files"
            git diff --cached --name-only
            exit 1
          fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Launches: refresh from Launch Library 2"
          git push
